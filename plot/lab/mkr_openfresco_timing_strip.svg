    <rect x="772.4" y="142" width="69.75" height="28" fill="#bba9d4"/>
    <rect x="842.15" y="142" width="10.85" height="28" fill="#9d88bf"/>
    <rect x="853" y="142" width="10" height="28" fill="#c4a27a"/><rect x="863" y="142" width="8" height="28" fill="#cdae88"/><rect x="871" y="142" width="7" height="28" fill="#e3d0b4"/>
    <rect x="878" y="142" width="6" height="28" fill="#a6a6a6"/>
    <rect x="884" y="142" width="186" height="28" fill="#e2e2e2"/>
  </g>
