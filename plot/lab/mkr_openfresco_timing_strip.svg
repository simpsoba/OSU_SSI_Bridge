    <text x="-128" y="161">Host</text>
    <text x="-128" y="339">Domain t<tspan font-size="70%" dy="2">int</tspan><tspan dy="-2"></tspan></text>
  </g>
  <g font-size="10" fill="#555">
    <text x="-128" y="104">(command)</text>
    <text x="-128" y="174">(OpenSees)</text>
  </g>

  <!-- Lab lane: init [0,2) | interp [2,10) | extrap [10,14) | interp [14,20) | extrap [20,24) | interp [24,30) -->
  <g stroke="#555" stroke-width="0.8">
    <rect x="140" y="72" width="62" height="28" fill="#c8c8c8"/>
    <rect x="202" y="72" width="248" height="28" fill="#a1c4a3"/>
    <rect x="450" y="72" width="124" height="28" fill="#96bae3"/>
    <rect x="574" y="72" width="186" height="28" fill="#a1c4a3"/>
    <rect x="760" y="72" width="124" height="28" fill="#96bae3"/>
    <rect x="884" y="72" width="186" height="28" fill="#a1c4a3"/>
  </g>
