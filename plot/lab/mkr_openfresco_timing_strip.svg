<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="545" viewBox="0 0 1248 545" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222">
  <!-- Timings: x = 140 + 31*T_w for T_w in [0,30] inside translate(148,0), i.e. page x = 288 + 31*T_w; cold-start gutter left of a break; send 2/14/24, force ready 10/20/30; burst 4 = finish 3 (commit 13/23 = force ready + finish) + begin 1 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1248" height="545" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="22" font-size="14" font-weight="bold">MKR-α + OpenFresco handshake timing (Δt_sim = 10 Δt_con; Δt_int = √λ Δt_sim; α_f = 1/(1+√ρ∞) ≈ 0.586, ρ∞ = 0.5)</text>
  <g transform="translate(148,0)">

  <!-- Window band -->
  <g stroke="#666" stroke-width="1">
    <line x1="140" y1="44" x2="1070" y2="44"/>
    <line x1="140" y1="36" x2="140" y2="52"/>
    <line x1="450" y1="36" x2="450" y2="52"/>
    <line x1="760" y1="36" x2="760" y2="52"/>
    <line x1="1070" y1="36" x2="1070" y2="52"/>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <rect x="270" y="37" width="50" height="14" fill="#fff"/><text x="295" y="48">Δt_sim</text>
    <rect x="580" y="37" width="50" height="14" fill="#fff"/><text x="605" y="48">Δt_sim</text>
    <rect x="890" y="37" width="50" height="14" fill="#fff"/><text x="915" y="48">Δt_sim</text>
  </g>

  <!-- force-ready lines at T_w = 10, 20, 30 -->
  <g stroke="#555" stroke-width="1" stroke-dasharray="4,3">
    <line x1="450" y1="56" x2="450" y2="176"/><line x1="450" y1="282" x2="450" y2="512"/>
    <line x1="760" y1="56" x2="760" y2="176"/><line x1="760" y1="282" x2="760" y2="512"/>
    <line x1="1070" y1="56" x2="1070" y2="176"/><line x1="1070" y1="282" x2="1070" y2="512"/>
  </g>

  <!-- Lane labels -->
