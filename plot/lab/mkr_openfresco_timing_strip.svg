    <text x="326" y="90" fill="#1b1b1b">interpolate → U(0+α)</text>
    <text x="512" y="90" fill="#1b1b1b">extrapolate</text>
    <text x="667" y="90" fill="#1b1b1b">interpolate → U(1+α)</text>
    <text x="822" y="90" fill="#1b1b1b">extrapolate</text>
    <text x="977" y="90" fill="#1b1b1b">interpolate → U(2+α)</text>
  </g>

  <!-- Host lane: first begin [0,2); bursts: finish [10,13) = read [10,10.4) solve [10.4,12.65) commit [12.65,13); begin [13,14) = compute, form, advance t, send -->
