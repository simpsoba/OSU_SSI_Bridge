    <text x="578" y="125">send U(1+α)</text>
    <text x="888" y="125">send U(2+α)</text>
  </g>

  <!-- Cold-start gutter (not to scale): x in [-8,116] here = [140,264] on page (4 Δt_con drawn); T_w = 0 at x = 140 (page 288) -->
